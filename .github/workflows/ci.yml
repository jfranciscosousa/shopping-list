name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: shopping_list
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d shopping_list"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_list
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/shopping_list
      SECRET_KEY_BASE: ci-secret
      OPENAI_API_KEY: sk-mock-key

    steps:
      - uses: actions/checkout@v6

      - name: Read .tool-versions
        uses: marocchino/tool-versions-action@v2
        id: versions

      - uses: pnpm/action-setup@v6
        with:
          version: ${{ steps.versions.outputs.pnpm }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ steps.versions.outputs.nodejs }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build:ci
