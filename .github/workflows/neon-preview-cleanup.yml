name: Clean up Neon preview branch

on:
  pull_request_target:
    branches: [master]
    types: [closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: neon-preview-cleanup-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # pull_request_target checks out trusted base code, never the PR head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Delete only this PR's preview database branch
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PRODUCTION_BRANCH_ID: ${{ secrets.NEON_PRODUCTION_BRANCH_ID }}
        with:
          script: |
            const cleanup = require('./.github/scripts/neon-preview-cleanup.cjs');
            await cleanup({ github, context, core });
